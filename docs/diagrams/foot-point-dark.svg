t">midpoint of both ankles</text><rect x="780.0" y="102.0" width="200.0" height="12.0" rx="6" fill="#2D2C29" stroke="#2D2C29" stroke-width="0"/><rect x="780.0" y="102.0" width="16.0" height="12.0" rx="6" fill="#98B377" stroke="#98B377" stroke-width="0"/><text x="992.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">≈ 4 %</text><line x1="340.0" y1="140.0" x2="1064.0" y2="140.0" stroke="#2D2C29" stroke-width="1" stroke-linecap="round"/><circle cx="346.0" cy="166.0" r="5" fill="#98B377"/><text x="360.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#EEECE4" text-anchor="start">ankle</text><text x="460.0" y="171.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#EEECE4" text-anchor="start">the one visible ankle</text><rect x="780.0" y="160.0" width="200.0" height="12.0" rx="6" fill="#2D2C29" stroke="#2D2C29" stroke-width="0"/><rect x="780.0" y="160.0" width="28.0" height="12.0" rx="6" fill="#98B377" stroke="#98B377" stroke-width="0"/><text x="992.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">≈ 7 %</text><line x1="340.0" y1="198.0" x2="1064.0" y2="198.0" stroke="#2D2C29" stroke-width="1" stroke-linecap="round"/><circle cx="346.0" cy="224.0" r="5" fill="#D9AE5C"/><text x="360.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#EEECE4" text-anchor="start">knees</text><text x="460.0" y="229.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#EEECE4" text-anchor="start">knee + (knee − hip)</text><rect x="780.0" y="218.0" width="200.0" height="12.0" rx="6