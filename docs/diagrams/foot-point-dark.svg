00.0" height="12.0" rx="6" fill="#EFA08A" stroke="#EFA08A" stroke-width="0"/><text x="992.0" y="345.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">≈ 50 %</text><line x1="340.0" y1="372.0" x2="1064.0" y2="372.0" stroke="#2D2C29" stroke-width="1" stroke-linecap="round"/><text x="340.0" y="398.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Tried top to bottom — the first rule whose keypoints are visible (≥ kp_conf) wins.</text><text x="340.0" y="417.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">σ travels with the point, so fusion trusts a visible ankle far more than an extrapolated one.</text></svg>