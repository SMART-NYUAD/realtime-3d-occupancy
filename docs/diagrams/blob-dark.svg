g transform="translate(110,400) rotate(-30.0)"><rect x="-14" y="-10" width="20" height="20" rx="4" fill="#EEECE4"/><path d="M6,-6 L16,-11 L16,11 L6,6 Z" fill="#EEECE4"/></g><text x="134.0" y="418.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#EEECE4" text-anchor="start">Camera A</text><text x="134.0" y="434.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A097" text-anchor="start">sees the feet</text><g transform="translate(690,100) rotate(154.9)"><rect x="-14" y="-10" width="20" height="20" rx="4" fill="#EEECE4"/><path d="M6,-6 L16,-11 L16,11 L6,6 Z" fill="#EEECE4"/></g><text x="540.0" y="70.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#EEECE4" text-anchor="start">Camera B</text><text x="540.0" y="86.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A097" text-anchor="start">feet hidden by desk</text><line x1="656.0" y1="426.0" x2="716.0" y2="426.0" stroke="#A3A097" stroke-width="2" stroke-linecap="round"/><text x="686.0" y="418.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#A3A097" text-anchor="middle">1 m</text><text x="772.0" y="58.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#A3A097" text-anchor="start" letter-spacing="1.4">HOW TO READ IT</text><rect x="772" y="86" width="22" height="16" rx="3" fill="#98B377" fill-opacity="0.22" stroke="#98B377" stroke-width="1.5"/><text x="806.0" y="99.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#EEECE4" text-anchor="start">Camera A trapezoid</text><text x="806.0" y="118.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Feet visible → short and tight.</text><rect x="772" y="144" width="22" height="16" rx="3" fill="#82A7D3" fill-opacity="0.14" stroke="#82A7D3" stroke-width="1.5"/><text x="806.0" y="157.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#EEECE4" text-anchor="start">Camera B trapezoid</text><text x="806.0" y="176.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Feet hidden → long, reaching</text><text x="806.0" y="192.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">toward the camera.</text><rect x="772" y="218" width="22" height="16" rx="3" fill="#E3876A" fill-opacity="0.55" stroke="#E3876A" stroke-width="1.5"/><text x="806.0" y="231.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#EEECE4" text-anchor="start">Overlap</text><text x="806.0" y="250.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Where the person is placed.</text><circle cx="783.0" cy="284.0" r="7" fill="#252422" stroke="#E3876A" stroke-width="2"/><text x="806.0" y="289.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#EEECE4" text-anchor="start">Point estimate alone</text><text x="806.0" y="308.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Would become a second dot.</text><line x1="772.0" y1="334.0" x2="1068.0" y2="334.0" stroke="#2D2C29" stroke-width="1" stroke-linecap="round"/><text x="772.0" y="352.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Occlusion only ever makes the feet</text><text x="772.0" y="370.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">look farther away, so each trapezoid</text><text x="772.0" y="388.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">reaches mostly toward its camera.</text><text x="772.0" y="406.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start"></text><text x="772.0" y="424.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">No overlap (e.g. calibration error)?</text><text x="772.0" y="442.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Fall back to the point mean.</text></svg>