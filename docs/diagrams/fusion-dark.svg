<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="230" viewBox="0 0 1160 230"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#A3A097" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#6F6C65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#E3876A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#82A7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#98B377" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="1159" height="229" rx="14" fill="#1C1B19" stroke="#34322E"/><rect x="40.0" y="36.0" width="244.0" height="132.0" rx="10" fill="#252422" stroke="#46443E" stroke-width="1"/><rect x="56.0" y="52.0" width="18.0" height="3.0" rx="1.5" fill="#82A7D3" stroke="#82A7D3" stroke-width="0"/><text x="56.0" y="76.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#A3A097" text-anchor="start">STEP 1</text><text x="56.0" y="98.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EEECE4" text-anchor="start">Cluster</text><text x="56.0" y="122.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Same person if ≤ 1.6 m apart</text><text x="56.0" y="139.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">or their trapezoids overlap.</text><line x1="288.0" y1="102.0" x2="307.0" y2="102.0" stroke="#A3A097" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="312.0" y="36.0" width="244.0" height="132.0" rx="10" fill="#252422" stroke="#46443E" stroke-width="1"/><rect x="328.0" y="52.0" width="18.0" height="3.0" rx="1.5" fill="#E3876A" stroke="#E3876A" stroke-width="0"/><text x="328.0" y="76.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#A3A097" text-anchor="start">STEP 2</text><text x="328.0" y="98.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EEECE4" text-anchor="start">Resolve</text><text x="328.0" y="122.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Inverse-variance mean (1/σ²);</text><text x="328.0" y="139.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">blob overlap when σ is high.</text><line x1="560.0" y1="102.0" x2="579.0" y2="102.0" stroke="#A3A097" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="584.0" y="36.0" width="244.0" height="132.0" rx="10" fill="#252422" stroke="#46443E" stroke-width="1"/><rect x="600.0" y="52.0" width="18.0" height="3.0" rx="1.5" fill="#E3876A" stroke="#E3876A" stroke-width="0"/><text x="600.0" y="76.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#A3A097" text-anchor="start">STEP 3</text><text x="600.0" y="98.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EEECE4" text-anchor="start">Match</text><text x="600.0" y="122.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Nearest track within 1.8 m,</text><text x="600.0" y="139.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">speed-capped at 2.5 m/s.</text><line x1="832.0" y1="102.0" x2="851.0" y2="102.0" stroke="#A3A097" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-muted)"/><rect x="856.0" y="36.0" width="244.0" height="132.0" rx="10" fill="#252422" stroke="#46443E" stroke-width="1"/><rect x="872.0" y="52.0" width="18.0" height="3.0" rx="1.5" fill="#98B377" stroke="#98B377" stroke-width="0"/><text x="872.0" y="76.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#A3A097" text-anchor="start">STEP 4</text><text x="872.0" y="98.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EEECE4" text-anchor="start">Lifecycle</text><text x="872.0" y="122.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">Confirm after 3 frames,</text><text x="872.0" y="139.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="start">coast up to 1.5 s unseen.</text><text x="580.0" y="204.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A097" text-anchor="middle">Runs every loop step on the detections from all cameras. Defaults shown; all tunable in the fusion: block of config.yaml.</text></svg>