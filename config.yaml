# ============================================================
# people_tracker_3d configuration  (multi-camera)
# ============================================================

# Every camera maps people into the SAME floor-map frame via its own
# homography (calib/<name>_homography.npy + .json sidecar). Add/remove cameras
# here; calibrate each with:  python calibrate.py --camera <name>
#
# intrinsics_file = the camera's lens model (focal length + distortion), made once
# with tools/calib_intrinsics.py. Points are undistorted before the homography, so
# the wide-angle barrel distortion stops bending positions near the image edges.
# Until the file exists the camera simply runs uncorrected. After creating it,
# re-click the floor calibration (calibrate.py): a homography fitted on raw pixels
# keeps being used uncorrected (with a warning) until you do.
cameras:
  - name: yi01
    source: "rtsp://192.168.50.72/ch0_0.h264"
    homography_file: "calib/yi01_homography.npy"
    intrinsics_file: "calib/yi01_intrinsics.json"
  - name: yi04
    source: "rtsp://192.168.50.198/ch0_0.h264"
    homography_file: "calib/yi04_homography.npy"
    intrinsics_file: "calib/yi04_intrinsics.json"
  - name: yi05
    source: "rtsp://192.168.50.68/ch0_0.h264"
    homography_file: "calib/yi05_homography.npy"
    intrinsics_file: "calib/yi05_intrinsics.json"

# Defaults applied to every camera (override per-camera by adding the key above).
camera_defaults:
  # source forms: "rtsp://.../ch0_0.h264" | "usb:0" | "/path/video.mp4"
  # RTSP streams are decoded at native resolution (NVDEC, see `sync:`); the
  # width/height/fps below only apply to USB cameras.
  width: 1280
  height: 720
  fps: 30

detector:
  # POSE model (…-pose.pt): also emits COCO-17 keypoints, so the foot point comes
  # from the ankles (or, when the legs are occluded, is extrapolated from the
  # hips/shoulders and flagged uncertain) instead of the box bottom. This is what
  # stops "confident but occluded" detections from putting a person at the waist.
  # The pose keypoints also drive the privacy mask (heads), so no face model runs.
  #
  # On the Thor use the TensorRT FP16 engine (~3x faster than PyTorch). Build it
  # once with:  python tools/export_engine.py   (falls back to the .pt if missing)
  model: "yolo11m-pose.engine"
  # Keep this LOW. In Ultralytics this conf filters detections BEFORE ByteTrack
  # sees them, so a high value disables ByteTrack's low-score recovery stage and
  # makes people flicker out on confidence dips. Let the thresholds in
  # bytetrack.yaml (new_track_thresh / track_high_thresh) do the real gating.
  conf: 0.15             # min confidence a box needs to reach the tracker
  iou: 0.5
  imgsz: 640
  device: "cuda:0"        # "cuda:0" on Thor GPU, or "cpu"
  half: true              # FP16 (PyTorch weights only; an engine's precision is fixed at export)
  max_batch: 4            # all cameras run as one batch (must match the engine's export batch)
  tracker: "bytetrack.yaml"   # repo-local ByteTrack config (./bytetrack.yaml)
  kp_conf: 0.5           # min per-keypoint visibility to trust an ankle/hip/etc.
                         # (pose models only). Higher = fall back to extrapolation
                         # sooner; lower = trust marginal keypoints.
  # Duplicate boxes for one person (e.g. a torso box inside the full-body box,
  # which survives NMS) would become a second dot. Before tracking, drop a box
  # that lies this fraction inside a stronger box, or whose shoulders sit on the
  # stronger box's shoulders. Privacy masking still covers every box.
  suppress_nested: true
  nested_overlap: 0.75
  # Per camera (in `cameras:` above) you can add image regions to ignore, e.g. a
  # monitor or poster that keeps being detected as a person (raw pixel polygons):
  #   ignore_zones: [[[1500, 200], [1700, 200], [1700, 400], [1500, 400]]]

# Locating a person whose ankles are hidden (desks, chairs, frame edge). With a
# lens-corrected calibration each camera's 3D pose is known, so the shoulders'
# line of sight is followed down to the person's shoulder height instead of
# guessing the feet with standing proportions. Heights are typical adult values;
# once two cameras see someone, their measured shoulder height is used instead.
localize:
  torso_estimates: true     # false = old foot guesses only
  seated_use_torso: true    # seated people: always the torso (feet are ahead of the chair)
  standing_shoulder_m: 1.40
  seated_shoulder_m: 1.05
  unknown_shoulder_m: 1.22  # posture unknown: in between, with a large uncertainty
  head_above_shoulder_m: 0.22

floorplan:
  # The top-down map = the shared world frame (meters, origin at the scan's
  # footprint min corner), rendered from the lab point-cloud scan. Every camera
  # calibrates into this frame. NOTE: flip_x/flip_y/clip_percentile/up_axis move
  # the frame itself — changing them invalidates every calibration.
  pointcloud_file: "data/smart_lab.las"
  px_per_m: 50          # resolution of the top-down map canvas
  margin_m: 0.5         # blank border around the map (meters)
  up_axis: auto         # vertical axis: auto | x | y | z (this scan is y-up)
  color_mode: rgb       # rgb = true scan colour | height = colour by height
  rgb_autocontrast: true # rgb mode: stretch the flat indoor greys for visibility
  ceiling_trim_m: 0.4   # rgb mode: drop the top N m so the ceiling doesn't hide the floor
  clip_percentile: 0.2  # trim this %% of stray points off each footprint edge
  flip_x: true          # mirror the map's X / Y if its orientation feels wrong
  flip_y: false

  # Shared floor reference points (world meters) reused across cameras so their
  # calibrations agree. Built up by calibrate.py; snap to existing ones to share.
  reference_points_file: "data/reference_points.json"

  # Usable-room spatial gate. "auto" derives a mask from the rendered top-down
  # scan, so detections projected into empty/outside-map space are
  # ignored before fusion. You can override with explicit room corners:
  #   valid_area: [[0,0], [8,0], [8,5], [0,5]]
  # Set [] to disable this and use only broad rectangular map bounds.
  valid_area: auto
  valid_area_tol_m: 0.15

# NTP-synchronized capture. The cameras are chrony/NTP clients of this host, so
# each frame's RTCP capture timestamp is a clock shared across cameras. With this
# on, track.py aligns all cameras to a common capture instant instead of fusing
# whatever each one last buffered — so a laggy stream can't split a moving person
# into a second dot. RTSP/H.264 only; needs system gi+GStreamer (see setup.sh).
sync:
  enabled: true
  decoder: hw             # hw=nvv4l2decoder (Jetson NVDEC, default) | sw=openh264 | nvdec=nvh264dec
  tol_ms: 75             # a camera's frame must be within this of the target instant
  buffer_sec: 1.0         # per-camera frame history kept for time-alignment
  latency_ms: 100         # rtspsrc jitter buffer
  # RTSP transport. tcp is reliable but under packet loss it *delays*: the jitter
  # buffer ratchets up and never drains, so one camera drifts ~1s behind the rest.
  # udp drops lost packets instead, keeping latency live. If a stream won't stay
  # connected over udp (some networks block it), set protocol: tcp.
  protocol: udp           # udp | tcp | udp+tcp
  drop_on_latency: true   # drop buffers that exceed the latency budget instead of growing it
  retransmission: false   # request RTP retransmission (true = fewer artifacts, more latency)
  # A camera lagging more than this behind the most-live one is treated as stuck and
  # dropped from the aligned set, rather than dragging every camera back to its time
  # (which freezes them once the gap exceeds buffer_sec). Keep below buffer_sec.
  lag_budget_ms: 500
  # Auto-recover a wedged stream by restarting its connection (fixes a stuck/laggy
  # camera ~95% of the time). A per-camera watchdog tears the pipeline down and
  # brings it back up; the other cameras keep running while it reconnects. 0 = off.
  reconnect_stuck_ms: 3000  # no decoded frame arrives for this long -> reconnect
  # Keep below lag_budget_ms, so a lagging camera reconnects before it is left out.
  reconnect_lag_ms: 450     # frames keep arriving but trail real time by more than
                            # this, sustained -> reconnect (0 = don't reconnect on lag)

fusion:
  enabled: true
  # Cross-camera merge distance. Was 1.6 m to absorb the old calibration's errors;
  # with cameras agreeing to ~8 cm, 1.0 m keeps neighbours at adjacent desks apart.
  merge_distance_m: 1.0   # detections this close (across cameras) = same person
  match_gate_m: 1.8       # max a person can move between frames to keep its ID
  max_age_s: 1.5          # keep a global track this long while unseen (occlusion)
  smoothing: 0.35          # position EMA: higher = snappier, lower = smoother
  show_raw_dots: true    # also draw faint per-camera dots behind fused markers

  # Each detection carries a foot-point sigma (meters): tight when the ankles are
  # visible, large when the feet were extrapolated through occlusion. A cluster's
  # position is the INVERSE-VARIANCE weighted mean of its members, so an occluded
  # (high-sigma) view barely moves the dot even when YOLO was confident about it.
  # Only fall back to the blob-trapezoid intersection when the feet are genuinely
  # uncertain (fused sigma above this). When a camera sees the ankles clearly, the
  # weighted point beats the trapezoid, so leave it alone.
  blob_min_sigma_m: 0.15

  # Relative dominance drop, applied on top: discard a member whose box
  # confidence is below this fraction of the cluster's best. Keep MODEST -- near
  # 1.0 it drops almost every second camera and strands the blob intersection
  # (which needs >=2 trapezoids), re-exposing the occluded point. 0 disables.
  conf_drop_ratio: 0.5

  # --- track lifecycle gates (kill duplicate dots and single-frame drags) ---
  # A new global track must be seen for confirm_s seconds before it's shown (time,
  # not frames, so it doesn't depend on the frame rate). confirm_s: 0 falls back to
  # n_init frames.
  confirm_s: 0.3
  n_init: 3
  # Unconfirmed (still-tentative) tracks age out this fast, so ghosts vanish
  # quickly instead of lingering for the full max_age.
  max_age_tentative_s: 0.4
  # Don't BIRTH a new track within this distance of an existing one -- that's
  # almost always the same person localized a second way (a duplicate dot), not a
  # new person. Keep below the spacing of distinct people. 0 disables.
  dup_suppress_m: 0.7
  # A person can't teleport: cap how far a marker may move per second. A single
  # drifted (occluded) observation then only nudges the dot and it recovers next
  # frame, instead of being dragged across the room. 0 disables.
  max_speed_mps: 2.5

  # Follow each camera's own person IDs: when a person's floor estimate jumps,
  # the track that owned the same per-camera IDs keeps them (no new ID and no
  # gray "ghost" left behind), up to identity_gate_m away.
  identity_matching: true
  identity_gate_m: 3.0
  # One person split into two tracks (each camera's IDs then belong to a different
  # one, which would keep them apart for good) is merged back: when their lines of
  # sight cross and their estimates are within dup_merge_m, or when the two tracks
  # stay within dup_merge_m, move together (speeds within dup_merge_speed_mps) and
  # share no camera for dup_merge_s. 0 = off.
  dup_merge_m: 0.5
  dup_merge_s: 1.0
  dup_merge_speed_mps: 0.4
  # A torso/head estimate placed at a guessed height (e.g. a standing person whose
  # legs are hidden, taken as seated) still joins a confident ankle estimate its
  # line of sight passes within ray_merge_m of, at a plausible shoulder height.
  ray_merge_m: 0.35
  # Two or more cameras seeing the shoulders: locate them where the lines of sight
  # cross (missing each other by at most tri_max_gap_m). This also measures the
  # shoulder height, which decides posture (below sitting_shoulder_max_m = sitting).
  triangulate: true
  tri_max_gap_m: 0.25
  sitting_shoulder_max_m: 1.20
  # Seated people who sit still become "settled": their dot is the median of the
  # last settle_window_s seconds and only moves when they really move (more than
  # deadband_m for deadband_s), and they stay on the map for settled_max_age_s
  # when hidden (e.g. behind a monitor). A settled track only accepts observations
  # within settled_gate_m, so someone walking past can't take it over.
  seated_persistence: true
  settled_max_age_s: 120
  settled_gate_m: 0.6
  settled_smoothing: true
  settle_speed_mps: 0.2
  settle_window_s: 3.0
  deadband_m: 0.3
  deadband_s: 1.0
  # Publish to the twin only people seen within this many seconds, or settled.
  publish_coast_s: 0.5

  # Ground-plane blob intersection. Instead of fusing each camera's single foot
  # point, project each detection's bbox to a floor *trapezoid* of foot-point
  # uncertainty and place the person where the cameras' trapezoids overlap. This
  # fixes the case where one camera can't see the feet (occluded/clipped) and
  # would otherwise put the person too far away. See src/groundblob.py.
  use_blob: true
  # The foot estimate errs one way: a hidden/occluded foot only ever looks too
  # FAR, so the trapezoid reaches mostly toward the camera (near) and barely past
  # the box bottom (far). Fractions are of the detection box height.
  blob_far_frac: 0.1      # feet-barely-farther margin past the box bottom
  blob_near_frac: 1.4     # feet-could-be-this-much-nearer reach (furniture occlusion)
  blob_clip_inflate: 2.5  # box clipped at frame bottom -> reach this many box-heights
                          # toward the camera instead ("can't see feet at all")
  blob_body_aspect: 3.0   # height:width of a standing person. Occlusion shrinks the
                          # box height but not its width, so reach down to where a
                          # body this tall would put the feet (0 = off). Over-reach
                          # is harmless: a tight camera still pins the result.
  blob_short_aspect: 1.8  # h:w below which a box is a partial (torso-only) detection
                          # whose bottom edge sits at the waist, not the feet (a full
                          # standing person is ~2.2). The shorter the box, the more
                          # the near reach (blob_near_frac) is scaled up toward the
                          # camera (scale = blob_short_aspect / observed_aspect, so
                          # it's 1.0 at the threshold; 0 = off).
  # A can't-see-feet camera's foot point drifts too far to cluster by distance
  # (merge_distance_m), so its *trapezoid* overlap is allowed to merge it instead,
  # up to this looser gate. This is what actually stops the "two dots for one
  # person" split. Keep below the spacing of distinct people to avoid over-merging.
  blob_merge_gate_m: 1.5
  # The trapezoid refines a position only when every camera had to fall back to a
  # feet guess (knees / hips / box), never over ankle, shoulder or measured
  # positions. false = old behaviour.
  blob_only_fallback: true
  show_blobs: false       # draw the trapezoids + their intersection on the map (debug)

output:
  show_window: true          # false = no GUI; positions are printed/published only
  show_camera_windows: true  # the "cameras" mosaic window (all cameras in one window)
  preview_width: 640         # width of each camera tile; drawing happens at this size
  # Privacy: mask every detected person's head in the preview/snapshots only,
  # located from the pose keypoints (nose/eyes/ears) the detector already
  # produces — no extra face model, so it costs ~nothing. The frames fed to the
  # detector are never modified, so tracking is unaffected.
  privacy:
    enabled: true
    method: pixelate         # pixelate | blur | solid
    scale: 1.3               # grow the head ellipse by this factor
    kp_thresh: 0.3           # min keypoint confidence to trust a head keypoint
  mqtt:
    enabled: true
    broker: "192.168.50.117"
    port: 1883
    # username/password: copy .env.example -> .env (MQTT_USERNAME, MQTT_PASSWORD)
    serial: "051003342"
    topic: "smx/device/051003342/position"
    publish_hz: 10
    trail_length: 10
    qos: 0
    retain: false

# Joint camera calibration (autocalib.py), now the default: calib/<cam>_homography.*
# were produced from a calibration walk, anchored to the existing map placement and
# validated on an independent walk (records in calib/autocalib/). track.py refuses
# to start if the map scan or its orientation settings change, since that would
# move the map frame these calibrations are anchored to.
autocalibration:
  anchored_id: 879a2688ddfdbea01c0ff7791939a22d1f72108fe15e7da61e158bfcdc747979
  map:
    scan_sha256: d29ea552906d8b3f5a39bd292388c6981dfa8645053bee12efebaa0234abc28b
    up_axis: auto
    resolved_up_axis: y
    handedness: 1
    flip_x: true
    flip_y: false
    clip_percentile: 0.2
